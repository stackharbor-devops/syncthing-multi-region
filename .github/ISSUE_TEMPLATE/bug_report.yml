name: Bug report
description: Something does not work as described in the README
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please remove passwords, device IDs, IP addresses you consider private and customer data from anything you paste.
        For security problems, do not open an issue: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options:
        - Install or uninstall
        - Scaling nodes in or out
        - Redeploy, clone, migrate or restart
        - Files not syncing, reverted, deleted or conflicting
        - Ignore rules
        - Multi-region
        - Status, alerts or backups
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: The `version` shown for the installed add-on (for example 0.1), or the git commit you installed from.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and stack
      description: Virtuozzo Application Platform / Jelastic version and hoster, and the app server image (for example LiteSpeed PHP on AlmaLinux 9).
  - type: input
    id: topology
    attributes:
      label: Layout
      description: Number of environments (regions) and nodes per layer, and which node the problem is on.
  - type: textarea
    id: logs
    attributes:
      label: Tasks log, status output and error messages
      description: Expand the failing entry in the environment's Tasks log and paste its output, plus the add-on's Status output and the exact text of any popup.
      render: text
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
