# SeaweedFS platform - Advanced Management ingress on the bl (nginx) node.
# Template: install-bl.sh fills the __SFS_*__ placeholders (control-plane IP, server name,
# CA file, optional 443 listener) and writes /etc/nginx/conf.d/sfs.conf (http context).
#
# Browser -> platform SLB (TLS) -> this server (80, or 443 with the env's own cert)
#   /ui/, /api/  : auth_request /auth/check -> control plane decides (session / bearer)
#   /sso, /auth/logout, /api/v1/ca : passed through (the control plane authenticates)
#   /api/v1/enroll : passed through from private addresses only (nodes normally
#                    enroll directly against https://<cp-ip>:8480)
# Upstream = control plane on the private network, TLS verified against the cluster CA.

limit_req_zone $binary_remote_addr zone=sfs_sso:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=sfs_api:10m rate=20r/s;

upstream sfs_cp {
    server __SFS_CP_IP__:8480 max_fails=3 fail_timeout=10s;
    keepalive 8;
}

server {
    listen 80;
    __SFS_SSL__
    server_name __SFS_SERVER_NAME__;

    server_tokens off;
    absolute_redirect off;  # behind the SLB the scheme here is http: keep Location relative
    client_max_body_size 1m;
    # Security headers (never add_header inside a location: that would drop these).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Shared upstream settings: TLS to the control plane pinned to the cluster CA.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Never let a client inject identity headers.
    proxy_set_header X-SFS-User "";
    proxy_set_header X-SFS-Role "";
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_ssl_trusted_certificate __SFS_CA_FILE__;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_name sfsctl;
    proxy_ssl_server_name off;
    proxy_ssl_session_reuse on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;

    location = /auth/check {
        internal;
        access_log off;
        proxy_pass https://sfs_cp/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }

    location = / {
        return 302 /ui/;
    }

    location = /ui {
        return 302 /ui/;
    }

    location /ui/ {
        auth_request /auth/check;  # sfs:auth_request
        error_page 401 = @sfs_login;
        proxy_pass https://sfs_cp;
    }

    location /api/ {
        auth_request /auth/check;  # sfs:auth_request
        limit_req zone=sfs_api burst=40 nodelay;
        proxy_pass https://sfs_cp;
    }

    # Public endpoint: the CA certificate is not secret.
    location = /api/v1/ca {
        limit_req zone=sfs_api burst=10 nodelay;
        proxy_pass https://sfs_cp;
    }

    location = /api/v1/enroll {
        # Requests relayed by the platform SLB always carry X-Forwarded-For: refuse
        # them, so enrollment is never reachable from the internet through this node.
        if ($http_x_forwarded_for != "") {
            return 403;
        }
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 100.64.0.0/10;
        allow fc00::/7;
        deny all;
        proxy_pass https://sfs_cp;
    }

    location = /sso {
        # The one-time grant is in the query string: keep it out of the access log.
        access_log off;
        limit_req zone=sfs_sso burst=20 nodelay;
        limit_req_status 429;
        limit_except GET { deny all; }
        proxy_pass https://sfs_cp;
    }

    location = /auth/logout {
        limit_except POST { deny all; }
        proxy_pass https://sfs_cp;
    }

    location @sfs_login {
        default_type text/plain;
        return 401 "Session missing or expired. Open Advanced Management again from the platform dashboard (storage layer add-on).\n";
    }

    location / {
        return 404;
    }
}
